<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Multiskolan">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#1c1259">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<title>Multiskolan – skriv</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<style>
  :root{
    --bg1:#0d0b2e; --bg2:#1c1259;
    --pink:#ff5ccf; --cyan:#3ee8ff; --lime:#8dff5a; --yellow:#ffd84a; --purple:#8a5cff;
    --soft:#c9c3ff; --ink:#2a1f6b;
    --c:var(--pink);
  }
  body.s-matte{--c:var(--cyan)}
  body.s-ord{--c:var(--lime)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;color:#fff;font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    background:radial-gradient(ellipse at 50% 120%, #3b1d8f 0%, var(--bg2) 35%, var(--bg1) 75%)}
  button{font-family:inherit;cursor:pointer;border:none;touch-action:manipulation}
  #stars{position:fixed;inset:0;z-index:0}
  .app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:10px 14px 12px;gap:8px}

  /* ---------- topp ---------- */
  .top{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .pill{display:flex;align-items:center;gap:8px;height:56px;padding:0 18px;border-radius:30px;font-size:24px;font-weight:700;
    background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 3px rgba(255,255,255,.15)}
  .quit{background:linear-gradient(180deg,#ff7c9c,#e23b6e);color:#fff;box-shadow:0 5px 0 #a3204b}
  .quit:active{transform:translateY(4px);box-shadow:0 1px 0 #a3204b}
  .who{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:600;color:var(--soft)}
  .who img{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.12);box-shadow:0 0 0 3px var(--c);object-fit:cover}
  .who img.hop{animation:hop .7s ease}
  h1{flex:1;text-align:center;font-size:clamp(26px,4vw,40px);color:var(--c);text-shadow:0 0 18px color-mix(in srgb,var(--c) 60%,transparent)}
  .coins{background:linear-gradient(180deg,#fff3b0,#ffcf3a);color:#5a3a00;box-shadow:0 5px 0 #b88a12}
  .coins.bump{animation:bump .5s ease}
  .streak{color:var(--yellow)}

  /* ---------- spelyta ---------- */
  main{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,40px)}
  .card{background:rgba(255,255,255,.08);border-radius:28px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.12)}
  .pad{position:relative;background:#fff;border-radius:28px;touch-action:none;overflow:hidden;
    box-shadow:0 0 0 6px var(--c),0 10px 0 6px color-mix(in srgb,var(--c) 55%,#000),0 0 40px color-mix(in srgb,var(--c) 45%,transparent);transition:box-shadow .2s,background .2s}
  .pad .padcv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  .pad.ok{background:#e4ffe9;box-shadow:0 0 0 6px #3cc878,0 10px 0 6px #23995a,0 0 40px rgba(60,200,120,.6)}
  .pad.bad{animation:shake .5s ease}
  .pad .hint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#cdbcf2;font-size:clamp(20px,3vw,30px);font-weight:600;text-align:center;padding:10px}
  .pad.used .hint,.pad.drawing .hint,.pad.ghosted .hint{display:none}
  .pad .check{position:absolute;top:8px;right:12px;font-size:clamp(26px,4vw,44px);pointer-events:none;display:none}
  .pad.ok .check{display:block;animation:pop .4s ease}

  /* ABC: en bokstav */
  .abc .target{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 26px;min-width:min(34vw,360px)}
  .abc .tl{font-size:clamp(22px,3vw,32px);font-weight:600;color:var(--soft)}
  .abc .big{font-size:min(44vh,30vw);line-height:1;font-weight:700;color:var(--c);text-shadow:0 8px 0 color-mix(in srgb,var(--c) 45%,#000),0 0 40px color-mix(in srgb,var(--c) 50%,transparent)}
  .abc .pad{width:min(64vh,54vw);height:min(64vh,54vw)}

  /* Matte */
  .matte{flex-direction:column;gap:12px}
  .matte .task{font-size:clamp(54px,9vh,92px);font-weight:700;display:flex;align-items:center;gap:.25em;line-height:1}
  .matte .n{color:#fff}
  .matte .op{color:var(--c)}
  .matte .ans{display:inline-grid;place-items:center;min-width:1.3em;height:1.2em;padding:0 .15em;border-radius:22px;background:#fff;color:var(--purple);box-shadow:0 0 0 5px var(--c)}
  .matte .help{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center;min-height:30px}
  .matte .grp{display:grid;grid-template-columns:repeat(5,auto);gap:4px;font-size:clamp(20px,3.2vh,30px);line-height:1}
  .matte .plus{font-size:clamp(24px,4vh,36px);font-weight:700;color:var(--c)}
  .matte .help.pulse .grp{animation:pop .8s ease-in-out infinite}
  .matte .pad{width:min(92vw,980px);height:min(40vh,420px);flex:0 0 auto}

  /* Ord: en ruta per bokstav */
  .ord{flex-direction:column;gap:10px}
  .ord .word{display:flex;align-items:center;gap:14px;font-size:clamp(24px,3.4vw,34px);font-weight:600;color:var(--soft)}
  .ord .pic{font-size:clamp(44px,7vh,70px);line-height:1}
  .ord .rows{display:flex;flex-direction:column;gap:18px;align-items:center}
  .ord .row{display:flex;gap:22px;justify-content:center}
  .ord .col{display:flex;flex-direction:column;align-items:center;gap:6px}
  .ord .let{font-size:calc(var(--bw)*.42);line-height:1;font-weight:700;color:var(--c);text-shadow:0 4px 0 color-mix(in srgb,var(--c) 45%,#000)}
  .ord .pad{width:var(--bw);height:calc(var(--bw)*1.15);border-radius:22px;box-shadow:0 0 0 5px var(--c),0 8px 0 5px color-mix(in srgb,var(--c) 55%,#000)}
  .ord .pad.ok{box-shadow:0 0 0 5px #3cc878,0 8px 0 5px #23995a}
  .ord .pad.cur{box-shadow:0 0 0 5px #fff,0 8px 0 5px color-mix(in srgb,var(--c) 55%,#000),0 0 30px #fff}
  .ord .er{height:44px;width:44px;border-radius:50%;background:rgba(255,255,255,.14);font-size:22px;visibility:hidden}
  .ord .er.show{visibility:visible}

  /* ---------- meddelande och knappar ---------- */
  .msg{flex:0 0 auto;min-height:44px;text-align:center;font-size:clamp(22px,3.4vw,32px);font-weight:700;padding:0 10px}
  .msg.ok{color:var(--lime)}
  .msg.no{color:#ffb3c7}
  .btns{flex:0 0 auto;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
  .btn{min-height:72px;padding:0 30px;border-radius:38px;font-size:clamp(24px,3.2vw,32px);font-weight:700;display:flex;align-items:center;gap:10px}
  .btn:active{transform:translateY(4px)}
  .b-clear{background:linear-gradient(180deg,#ffffff,#e6dcff);color:var(--ink);box-shadow:0 6px 0 #9d8ad8}
  .b-say{background:linear-gradient(180deg,#b8fff6,#3ee8ff);color:#06485a;box-shadow:0 6px 0 #1a8fae}
  .b-ok{background:linear-gradient(180deg,#b8ff9a,#5ad04a);color:#0d4a12;box-shadow:0 6px 0 #2f8f2a;min-width:200px;justify-content:center}
  .btn:active.b-clear{box-shadow:0 2px 0 #9d8ad8}.btn:active.b-say{box-shadow:0 2px 0 #1a8fae}.btn:active.b-ok{box-shadow:0 2px 0 #2f8f2a}

  /* ---------- effekter ---------- */
  .plus10{position:fixed;z-index:50;font-size:44px;font-weight:700;color:var(--yellow);text-shadow:0 4px 0 #8a5a00;pointer-events:none;animation:rise 1.2s ease forwards}
  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
  .confetti span{position:absolute;top:-10%;font-size:34px;animation:fall linear forwards}
  .loading{position:fixed;inset:0;z-index:60;display:grid;place-content:center;justify-items:center;gap:14px;font-size:30px;font-weight:600;background:var(--bg1)}
  .loading .rk{font-size:70px;animation:hop 1s ease-in-out infinite}
  .done{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:rgba(10,8,40,.7);backdrop-filter:blur(4px)}
  .done.show{display:grid}
  .done .box{background:linear-gradient(180deg,#2b1f7a,#1c1259);border-radius:32px;padding:30px 40px;text-align:center;box-shadow:0 0 0 5px var(--c),0 0 60px color-mix(in srgb,var(--c) 50%,transparent);max-width:92vw}
  .done h2{font-size:40px;color:var(--c);margin-bottom:6px}
  .done p{font-size:28px;margin:8px 0 22px}
  .done .btns{gap:14px}
  @keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px)}}
  @keyframes bump{40%{transform:scale(1.25)}}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}
  @keyframes rise{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1;transform:translate(-50%,-20px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-140px) scale(1)}}
  @keyframes fall{to{transform:translateY(120vh) rotate(540deg)}}

  /* stående skärm (padda på höjden) */
  @media (orientation:portrait){
    .abc{flex-direction:column}
    .abc .target{flex-direction:row;gap:20px;padding:10px 26px;min-width:0}
    .abc .big{font-size:min(20vh,30vw)}
    .abc .pad{width:min(88vw,52vh);height:min(88vw,52vh)}
    .matte .pad{height:min(36vh,420px)}
  }
  @media (max-height:600px){
    .pill{height:46px;font-size:20px}.who img{width:46px;height:46px}
    .btn{min-height:58px}
  }
  /* mobil: rubriken och namnet får ge plats åt knapparna i toppraden */
  @media (max-width:600px), (max-height:500px){
    .top h1, .who span{display:none}
    .top .streak{margin-left:auto}
    .pill{height:44px;font-size:18px;padding:0 12px;white-space:nowrap}
    .who img{width:44px;height:44px}
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="app">
  <header class="top" data-fs-slot data-fs-class="pill fsPill">
    <button class="pill quit" id="quit">✕ Avsluta</button>
    <div class="who"><img id="face" alt=""><span id="name"></span></div>
    <h1 id="title">ABC Skolan</h1>
    <div class="pill streak" title="Rätt den här gången">⭐ <b id="streak">0</b></div>
    <div class="pill coins" id="coinsPill">🪙 <b id="coins">0</b></div>
  </header>
  <main id="game"></main>
  <div class="msg" id="msg"></div>
  <footer class="btns">
    <button class="btn b-clear" id="bClear">🧽 Sudda</button>
    <button class="btn b-say" id="bSay">🔊 Lyssna</button>
    <button class="btn b-ok" id="bOk">✓ Klar!</button>
  </footer>
</div>
<div class="loading" id="loading"><div class="rk">🚀</div>Laddar…</div>
<div class="done" id="done">
  <div class="box">
    <h2 id="doneTitle">Bra jobbat!</h2>
    <p id="doneText"></p>
    <div class="btns">
      <button class="btn b-clear" id="dMore">✏️ Träna mer</button>
      <button class="btn b-ok" id="dMenu">🏠 Till menyn</button>
    </div>
  </div>
</div>
<script src="js/save.js"></script>
<script src="js/fullscreen.js"></script>
<script type="module" src="js/skola.js"></script>
</body>
</html>
